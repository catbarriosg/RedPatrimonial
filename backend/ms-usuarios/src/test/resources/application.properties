# Las pruebas usan una base H2 en memoria: no necesitan MySQL instalado
spring.datasource.url=jdbc:h2:mem:db_usuarios_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
